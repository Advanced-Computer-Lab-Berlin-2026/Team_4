<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Borrow tools and equipment from your neighbours with ShareShed." />
    <link rel="icon" href="/shareshed-mark.svg" type="image/svg+xml" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('shareshed-theme'); } catch {}
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <title>ShareShed</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
